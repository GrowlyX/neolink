# Licences and supply chain. `cargo deny check` runs in CI.

[advisories]
version = 2
yanked = "warn"
# Every ignore below is `unmaintained` (not vulnerable) and is transitive
# through GPUI. Re-check when GPUI moves.
ignore = [
  { id = "RUSTSEC-2025-0052", reason = "async-std discontinued; pulled in by gpui" },
  { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; pulled in by gpui" },
  { id = "RUSTSEC-2024-0436", reason = "paste archived; build-time only, via gpui" },
  { id = "RUSTSEC-2025-0134", reason = "pin-utils unmaintained; pulled in by gpui" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; build-time only" },
  { id = "RUSTSEC-2026-0192", reason = "rustls-pemfile unmaintained; pulled in by gpui" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; GPUI text shaping" },
  { id = "RUSTSEC-2026-0370", reason = "ttf-parser unmaintained; GPUI text shaping" },
  { id = "RUSTSEC-2026-0371", reason = "ttf-parser unmaintained; GPUI text shaping" },
  { id = "RUSTSEC-2026-0372", reason = "ttf-parser unmaintained; GPUI text shaping" },
  { id = "RUSTSEC-2026-0441", reason = "zbus/zvariant unmaintained; gpui portal support" },
]

[licenses]
version = 2
# Everything we link must be permissive or file-level copyleft (MPL). Neolink
# itself is MIT; nothing here relicenses our source.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "NCSA",
  "Ubuntu-font-1.0",
  "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
allow-wildcard-paths = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
