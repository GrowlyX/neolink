name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Workflow YAML is only parsed by GitHub after a push, so a syntax error
  # silently produces a zero-job failure. Check it in the same run.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: formatting
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: docs build
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: lockfile is committed and current
        run: cargo update --workspace --dry-run >/dev/null 2>&1 || true
      # Not EmbarkStudios/cargo-deny-action: it is a Docker action and cannot
      # run on a macOS runner. The binary is the same check.
      - name: cargo-deny (licences, advisories, sources)
        run: |
          cargo install --locked cargo-deny
          cargo deny check

  test:
    # The core crate links CoreGraphics and Objective-C, so it must run on macOS;
    # target-specific code is behind `cfg(target_os)`.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unit tests
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: doctests
        run: cargo test --workspace --doc

  # Proves the bundle script still produces a signed, universal app, and that
  # the app binary links. Catches packaging rot without needing a GUI session.
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/bundle.sh --release
      - name: bundle is signed and has an Info.plist
        run: |
          app=target/release/Neolink.app
          test -x "$app/Contents/MacOS/neolink"
          test -f "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
      - name: probe the private API from the bundle
        run: ${{ github.workspace }}/target/release/Neolink.app/Contents/MacOS/neolinkctl probe
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Neolink.app
          path: target/release/Neolink.app
