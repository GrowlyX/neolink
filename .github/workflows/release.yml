name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  # One universal, ad-hoc signed bundle. Swap the identity in the script (or
  # set CODESIGN_IDENTITY) and notarise before this is a real distribution.
  app:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check the tag matches the crate version
        run: |
          v="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$v" = "$crate" || { echo "tag $v != Cargo.toml $crate"; exit 1; }
      - run: scripts/bundle.sh --release
      - name: zip the bundle
        run: ditto -c -k --keepParent target/release/Neolink.app "Neolink_${GITHUB_REF_NAME#v}_macos.zip"
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "Neolink_${GITHUB_REF_NAME#v}_macos.zip"
