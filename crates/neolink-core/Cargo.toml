[package]
name = "neolink-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
core-foundation = "0.10"
libc = "0.2"
rsa = "0.9.10"
sha2 = { version = "0.10.9", features = ["oid"] }
hmac = "0.12.1"
aes = "0.8.4"
cbc = "0.1.2"
subtle = "2.6.1"
zeroize = "1.8.2"
rand = "0.8.5"

[build-dependencies]
cc = "1"

[[bin]]
name = "neolinkctl"
path = "src/bin/neolinkctl.rs"

[dependencies.objc2-core-foundation]
version = "0.3"
