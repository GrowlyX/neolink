[package]
name = "neolink"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, native DisplayLink-compatible display manager for macOS"

[dependencies]
neolink-core = { path = "../neolink-core" }
gpui = "0.2"
anyhow = "1"
objc2 = "0.6"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "neolink"
path = "src/main.rs"
